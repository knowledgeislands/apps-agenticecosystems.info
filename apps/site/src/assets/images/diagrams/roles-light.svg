<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1004" width="400" height="1004" role="img" aria-labelledby="roles-title roles-desc">
<title id="roles-title">How the parts relate at run time</title>
<desc id="roles-desc">A client is a window onto a session, which an agent host owns. Inside the host, an agent harness runs the session and turns a model into an agent; within the session, a subagent is started by the agent for part of its work and returns the result. An agent team is several sessions messaging each other. A bot, still a draft term, is a named agent its host keeps and wakes.</desc>
<style>
  text{font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;}
  .b{font-weight:650} .sb{font-weight:600}
  .nf{fill:none}
  
  .bg{fill:#f8f7f4} .card{fill:#ffffff} .muted{fill:#eeece6} .accent{fill:#e7eff7}
  .primary{fill:#1f4e79} .notice{fill:#fdf3dc}
  .ln{stroke:#7c8492} .lnp{stroke:#1f4e79} .lnn{stroke:#a07a1c}
  .fln{fill:#7c8492} .fp{fill:#1f4e79}
  .t{fill:#1b2230} .tm{fill:#4f5868} .tp{fill:#1f4e79} .ta{fill:#173b5c} .tpf{fill:#ffffff}
  .tn{fill:#5a4207} .yes{fill:#1d6b3a} .partial{fill:#8a5a00} .no{fill:#9b2c2c} .unk{fill:#4f5868}
  .syes{stroke:#1d6b3a} .spartial{stroke:#8a5a00} .sno{stroke:#9b2c2c}
</style>
