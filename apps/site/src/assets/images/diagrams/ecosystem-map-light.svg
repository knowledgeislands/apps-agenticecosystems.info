<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1350" width="400" height="1350" role="img" aria-labelledby="ecosystem-map-title ecosystem-map-desc">
<title id="ecosystem-map-title">The map at a glance</title>
<desc id="ecosystem-map-desc">The parts products play, with how many product cards fill each: Client, 9; Agent host, 4; Agent, 1; Agent harness, 7; Model, 0. The specifications that join them: MCP between an agent harness and the servers offering its tools, ACP between a client and an agent, AHP between a client and an agent host, A2A between an agent and a remote agent, and Agent Skills, what an agent harness loads. And the bot, Knowledge Islands' word for a durable, named agent its host keeps and wakes, still a draft.</desc>
<style>
  text{font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;}
  .b{font-weight:650} .sb{font-weight:600}
  .nf{fill:none}
  
  .bg{fill:#f8f7f4} .card{fill:#ffffff} .muted{fill:#eeece6} .accent{fill:#e7eff7}
  .primary{fill:#1f4e79} .notice{fill:#fdf3dc}
  .ln{stroke:#7c8492} .lnp{stroke:#1f4e79} .lnn{stroke:#a07a1c}
  .fln{fill:#7c8492} .fp{fill:#1f4e79}
  .t{fill:#1b2230} .tm{fill:#4f5868} .tp{fill:#1f4e79} .ta{fill:#173b5c} .tpf{fill:#ffffff}
  .tn{fill:#5a4207} .yes{fill:#1d6b3a} .partial{fill:#8a5a00} .no{fill:#9b2c2c} .unk{fill:#4f5868}
  .syes{stroke:#1d6b3a} .spartial{stroke:#8a5a00} .sno{stroke:#9b2c2c}
</style>
<rect class="bg" x="0" y="0" width="400" height="1350"/>
<text x="20" y="40" font-size="20" class="t b">The parts products play</text><rect x="20" y="56" width="360" height="86" rx="10" class="card ln" stroke-width="1.25"/><text x="34" y="89" font-size="21" class="tp b">Client</text><text x="366" y="89" font-size="18" class="tm" text-anchor="end">9 products</text><circle cx="43" cy="115" r="9" class="fp"/><circle cx="69" cy="115" r="9" class="fp"/><circle cx="95" cy="115" r="9" class="fp"/><circle cx="121" cy="115" r="9" class="fp"/><circle cx="147" cy="115" r="9" class="fp"/><circle cx="173" cy="115" r="9" class="fp"/><circle cx="199" cy="115" r="9" class="fp"/><circle cx="225" cy="115" r="9" class="fp"/><circle cx="251" cy="115" r="9" class="fp"/><rect x="20" y="152" width="360" height="86" rx="10" class="card ln" stroke-width="1.25"/><text x="34" y="185" font-size="21" class="tp b">Agent host</text><text x="366" y="185" font-size="18" class="tm" text-anchor="end">4 products</text><circle cx="43" cy="211" r="9" class="fp"/><circle cx="69" cy="211" r="9" class="fp"/><circle cx="95" cy="211" r="9" class="fp"/><circle cx="121" cy="211" r="9" class="fp"/><rect x="20" y="248" width="360" height="86" rx="10" class="card ln" stroke-width="1.25"/><text x="34" y="281" font-size="21" class="tp b">Agent</text><text x="366" y="281" font-size="18" class="tm" text-anchor="end">1 product</text><circle cx="43" cy="307" r="9" class="fp"/><rect x="20" y="344" width="360" height="86" rx="10" class="card ln" stroke-width="1.25"/><text x="34" y="377" font-size="21" class="tp b">Agent harness</text><text x="366" y="377" font-size="18" class="tm" text-anchor="end">7 products</text><circle cx="43" cy="403" r="9" class="fp"/><circle cx="69" cy="403" r="9" class="fp"/><circle cx="95" cy="403" r="9" class="fp"/><circle cx="121" cy="403" r="9" class="fp"/><circle cx="147" cy="403" r="9" class="fp"/><circle cx="173" cy="403" r="9" class="fp"/><circle cx="199" cy="403" r="9" class="fp"/><rect x="20" y="440" width="360" height="82" rx="10" class="accent ln" stroke-width="1.25"/><text x="34" y="473" font-size="21" class="tp b">Model</text><text x="366" y="473" font-size="18" class="tm" text-anchor="end">no product card yet</text><text x="34" y="506" font-size="18" class="t">the base every part builds on</text><text x="20" y="546" font-size="18" class="tm"><tspan x="20" dy="0">One dot per product card, 10 in all. A</tspan><tspan x="20" dy="24.3">product can play several parts.</tspan></text><text x="20" y="622.6" font-size="20" class="t b">The specifications that join them</text><rect x="20" y="638.6" width="64.433632" height="32" rx="16" class="primary"/><text x="52.216816" y="660.6" font-size="18" class="tpf b" text-anchor="middle">MCP</text><text x="380" y="660.6" font-size="18" class="tm" text-anchor="end">9 products</text><text x="20" y="696.6" font-size="18" class="t"><tspan x="20" dy="0">Between an agent harness and the</tspan><tspan x="20" dy="24.3">servers offering its tools.</tspan></text><rect x="20" y="745.2" width="61.48685200000001" height="32" rx="16" class="primary"/><text x="50.74342600000001" y="767.2" font-size="18" class="tpf b" text-anchor="middle">ACP</text><text x="380" y="767.2" font-size="18" class="tm" text-anchor="end">5 products</text><text x="20" y="803.2" font-size="18" class="t"><tspan x="20" dy="0">Between a client and an agent.</tspan></text><rect x="20" y="827.5" width="64.433632" height="32" rx="16" class="primary"/><text x="52.216816" y="849.5" font-size="18" class="tpf b" text-anchor="middle">AHP</text><text x="380" y="849.5" font-size="18" class="tm" text-anchor="end">no product yet</text><text x="20" y="885.5" font-size="18" class="t"><tspan x="20" dy="0">Between a client and an agent host.</tspan></text><rect x="20" y="909.8" width="59.32588" height="32" rx="16" class="primary"/><text x="49.66294" y="931.8" font-size="18" class="tpf b" text-anchor="middle">A2A</text><text x="380" y="931.8" font-size="18" class="tm" text-anchor="end">1 product</text><text x="20" y="967.8" font-size="18" class="t"><tspan x="20" dy="0">Between an agent and a remote agent.</tspan></text><rect x="20" y="992.0999999999999" width="130.441504" height="32" rx="16" class="primary"/><text x="85.220752" y="1014.0999999999999" font-size="18" class="tpf b" text-anchor="middle">Agent Skills</text><text x="380" y="1014.0999999999999" font-size="18" class="tm" text-anchor="end">5 products</text><text x="20" y="1050.1" font-size="18" class="t"><tspan x="20" dy="0">Shapes what an agent harness loads.</tspan></text><text x="20" y="1102.3999999999999" font-size="20" class="t b">And Knowledge Islands' own word</text><rect x="20" y="1118.3999999999999" width="360" height="142.9" rx="10" class="card lnn" stroke-width="1.5" stroke-dasharray="5 4"/><text x="34" y="1152.3999999999999" font-size="21" class="tp b">Bot</text><g><rect x="80.608294" y="1133.3999999999999" width="65.113" height="27" rx="13.5" class="notice lnn" stroke-width="1.25" stroke-dasharray="3 2.5"/><text x="113.164794" y="1153.3799999999999" font-size="18" class="tn b" text-anchor="middle">Draft</text></g><text x="34" y="1184.3999999999999" font-size="18" class="t"><tspan x="34" dy="0">A durable, named agent with its own</tspan><tspan x="34" dy="24.3">memory and processes, which its</tspan><tspan x="34" dy="24.3">agent host keeps and wakes.</tspan></text><text x="20" y="1291.3" font-size="18" class="tm"><tspan x="20" dy="0">Counts from draft product cards, as of 22</tspan><tspan x="20" dy="24.3">November 2026.</tspan></text>
</svg>
