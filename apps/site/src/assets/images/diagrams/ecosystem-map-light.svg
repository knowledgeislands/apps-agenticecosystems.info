<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1428" width="400" height="1428" role="img" aria-labelledby="ecosystem-map-title ecosystem-map-desc">
<title id="ecosystem-map-title">The map at a glance</title>
<desc id="ecosystem-map-desc">The parts products play, with how many product cards fill each: Client, 29; Agent host, 11; Agent, 3; Agent harness, 26; Model, 0. The specifications that join them: MCP between an agent harness and the servers offering its tools, ACP between a client and an agent, AHP between a client and an agent host, A2A between an agent and a remote agent, and Agent Skills, what an agent harness loads. And the bot, Knowledge Islands' word for a durable, named agent its host keeps and wakes, still a draft.</desc>
<style>
  text{font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;}
  .b{font-weight:650} .sb{font-weight:600}
  .nf{fill:none}
  
  .bg{fill:#f8f7f4} .card{fill:#ffffff} .muted{fill:#eeece6} .accent{fill:#e7eff7}
  .primary{fill:#1f4e79} .notice{fill:#fdf3dc}
  .ln{stroke:#7c8492} .lnp{stroke:#1f4e79} .lnn{stroke:#a07a1c}
  .fln{fill:#7c8492} .fp{fill:#1f4e79}
  .t{fill:#1b2230} .tm{fill:#4f5868} .tp{fill:#1f4e79} .ta{fill:#173b5c} .tpf{fill:#ffffff}
  .tn{fill:#5a4207} .yes{fill:#1d6b3a} .partial{fill:#8a5a00} .no{fill:#9b2c2c} .unk{fill:#4f5868}
  .syes{stroke:#1d6b3a} .spartial{stroke:#8a5a00} .sno{stroke:#9b2c2c}
</style>
<rect class="bg" x="0" y="0" width="400" height="1428"/>
<text x="20" y="40" font-size="20" class="t b">The parts products play</text><rect x="20" y="56" width="360" height="138" rx="10" class="card ln" stroke-width="1.25"/><text x="34" y="89" font-size="21" class="tp b">Client</text><text x="366" y="89" font-size="18" class="tm" text-anchor="end">29 products</text><circle cx="43" cy="115" r="9" class="fp"/><circle cx="69" cy="115" r="9" class="fp"/><circle cx="95" cy="115" r="9" class="fp"/><circle cx="121" cy="115" r="9" class="fp"/><circle cx="147" cy="115" r="9" class="fp"/><circle cx="173" cy="115" r="9" class="fp"/><circle cx="199" cy="115" r="9" class="fp"/><circle cx="225" cy="115" r="9" class="fp"/><circle cx="251" cy="115" r="9" class="fp"/><circle cx="277" cy="115" r="9" class="fp"/><circle cx="303" cy="115" r="9" class="fp"/><circle cx="329" cy="115" r="9" class="fp"/><circle cx="355" cy="115" r="9" class="fp"/><circle cx="43" cy="141" r="9" class="fp"/><circle cx="69" cy="141" r="9" class="fp"/><circle cx="95" cy="141" r="9" class="fp"/><circle cx="121" cy="141" r="9" class="fp"/><circle cx="147" cy="141" r="9" class="fp"/><circle cx="173" cy="141" r="9" class="fp"/><circle cx="199" cy="141" r="9" class="fp"/><circle cx="225" cy="141" r="9" class="fp"/><circle cx="251" cy="141" r="9" class="fp"/><circle cx="277" cy="141" r="9" class="fp"/><circle cx="303" cy="141" r="9" class="fp"/><circle cx="329" cy="141" r="9" class="fp"/><circle cx="355" cy="141" r="9" class="fp"/><circle cx="43" cy="167" r="9" class="fp"/><circle cx="69" cy="167" r="9" class="fp"/><circle cx="95" cy="167" r="9" class="fp"/><rect x="20" y="204" width="360" height="86" rx="10" class="card ln" stroke-width="1.25"/><text x="34" y="237" font-size="21" class="tp b">Agent host</text><text x="366" y="237" font-size="18" class="tm" text-anchor="end">11 products</text><circle cx="43" cy="263" r="9" class="fp"/><circle cx="69" cy="263" r="9" class="fp"/><circle cx="95" cy="263" r="9" class="fp"/><circle cx="121" cy="263" r="9" class="fp"/><circle cx="147" cy="263" r="9" class="fp"/><circle cx="173" cy="263" r="9" class="fp"/><circle cx="199" cy="263" r="9" class="fp"/><circle cx="225" cy="263" r="9" class="fp"/><circle cx="251" cy="263" r="9" class="fp"/><circle cx="277" cy="263" r="9" class="fp"/><circle cx="303" cy="263" r="9" class="fp"/><rect x="20" y="300" width="360" height="86" rx="10" class="card ln" stroke-width="1.25"/><text x="34" y="333" font-size="21" class="tp b">Agent</text><text x="366" y="333" font-size="18" class="tm" text-anchor="end">3 products</text><circle cx="43" cy="359" r="9" class="fp"/><circle cx="69" cy="359" r="9" class="fp"/><circle cx="95" cy="359" r="9" class="fp"/><rect x="20" y="396" width="360" height="112" rx="10" class="card ln" stroke-width="1.25"/><text x="34" y="429" font-size="21" class="tp b">Agent harness</text><text x="366" y="429" font-size="18" class="tm" text-anchor="end">26 products</text><circle cx="43" cy="455" r="9" class="fp"/><circle cx="69" cy="455" r="9" class="fp"/><circle cx="95" cy="455" r="9" class="fp"/><circle cx="121" cy="455" r="9" class="fp"/><circle cx="147" cy="455" r="9" class="fp"/><circle cx="173" cy="455" r="9" class="fp"/><circle cx="199" cy="455" r="9" class="fp"/><circle cx="225" cy="455" r="9" class="fp"/><circle cx="251" cy="455" r="9" class="fp"/><circle cx="277" cy="455" r="9" class="fp"/><circle cx="303" cy="455" r="9" class="fp"/><circle cx="329" cy="455" r="9" class="fp"/><circle cx="355" cy="455" r="9" class="fp"/><circle cx="43" cy="481" r="9" class="fp"/><circle cx="69" cy="481" r="9" class="fp"/><circle cx="95" cy="481" r="9" class="fp"/><circle cx="121" cy="481" r="9" class="fp"/><circle cx="147" cy="481" r="9" class="fp"/><circle cx="173" cy="481" r="9" class="fp"/><circle cx="199" cy="481" r="9" class="fp"/><circle cx="225" cy="481" r="9" class="fp"/><circle cx="251" cy="481" r="9" class="fp"/><circle cx="277" cy="481" r="9" class="fp"/><circle cx="303" cy="481" r="9" class="fp"/><circle cx="329" cy="481" r="9" class="fp"/><circle cx="355" cy="481" r="9" class="fp"/><rect x="20" y="518" width="360" height="82" rx="10" class="accent ln" stroke-width="1.25"/><text x="34" y="551" font-size="21" class="tp b">Model</text><text x="366" y="551" font-size="18" class="tm" text-anchor="end">no product card yet</text><text x="34" y="584" font-size="18" class="t">the base every part builds on</text><text x="20" y="624" font-size="18" class="tm"><tspan x="20" dy="0">One dot per product card, 35 in all. A</tspan><tspan x="20" dy="24.3">product can play several parts.</tspan></text><text x="20" y="700.6" font-size="20" class="t b">The specifications that join them</text><rect x="20" y="716.6" width="64.433632" height="32" rx="16" class="primary"/><text x="52.216816" y="738.6" font-size="18" class="tpf b" text-anchor="middle">MCP</text><text x="380" y="738.6" font-size="18" class="tm" text-anchor="end">29 products</text><text x="20" y="774.6" font-size="18" class="t"><tspan x="20" dy="0">Between an agent harness and the</tspan><tspan x="20" dy="24.3">servers offering its tools.</tspan></text><rect x="20" y="823.2" width="61.48685200000001" height="32" rx="16" class="primary"/><text x="50.74342600000001" y="845.2" font-size="18" class="tpf b" text-anchor="middle">ACP</text><text x="380" y="845.2" font-size="18" class="tm" text-anchor="end">16 products</text><text x="20" y="881.2" font-size="18" class="t"><tspan x="20" dy="0">Between a client and an agent.</tspan></text><rect x="20" y="905.5" width="64.433632" height="32" rx="16" class="primary"/><text x="52.216816" y="927.5" font-size="18" class="tpf b" text-anchor="middle">AHP</text><text x="380" y="927.5" font-size="18" class="tm" text-anchor="end">no product yet</text><text x="20" y="963.5" font-size="18" class="t"><tspan x="20" dy="0">Between a client and an agent host.</tspan></text><rect x="20" y="987.8" width="59.32588" height="32" rx="16" class="primary"/><text x="49.66294" y="1009.8" font-size="18" class="tpf b" text-anchor="middle">A2A</text><text x="380" y="1009.8" font-size="18" class="tm" text-anchor="end">3 products</text><text x="20" y="1045.8" font-size="18" class="t"><tspan x="20" dy="0">Between an agent and a remote agent.</tspan></text><rect x="20" y="1070.1" width="130.441504" height="32" rx="16" class="primary"/><text x="85.220752" y="1092.1" font-size="18" class="tpf b" text-anchor="middle">Agent Skills</text><text x="380" y="1092.1" font-size="18" class="tm" text-anchor="end">13 products</text><text x="20" y="1128.1" font-size="18" class="t"><tspan x="20" dy="0">Shapes what an agent harness loads.</tspan></text><text x="20" y="1180.3999999999999" font-size="20" class="t b">And Knowledge Islands' own word</text><rect x="20" y="1196.3999999999999" width="360" height="142.9" rx="10" class="card lnn" stroke-width="1.5" stroke-dasharray="5 4"/><text x="34" y="1230.3999999999999" font-size="21" class="tp b">Bot</text><g><rect x="80.608294" y="1211.3999999999999" width="65.113" height="27" rx="13.5" class="notice lnn" stroke-width="1.25" stroke-dasharray="3 2.5"/><text x="113.164794" y="1231.3799999999999" font-size="18" class="tn b" text-anchor="middle">Draft</text></g><text x="34" y="1262.3999999999999" font-size="18" class="t"><tspan x="34" dy="0">A durable, named agent with its own</tspan><tspan x="34" dy="24.3">memory and processes, which its</tspan><tspan x="34" dy="24.3">agent host keeps and wakes.</tspan></text><text x="20" y="1369.3" font-size="18" class="tm"><tspan x="20" dy="0">Counts from draft product cards, as of 22</tspan><tspan x="20" dy="24.3">November 2026.</tspan></text>
</svg>
