<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1170" width="400" height="1170" role="img" aria-labelledby="product-card-anatomy-title product-card-anatomy-desc">
<title id="product-card-anatomy-title">How to read a product page</title>
<desc id="product-card-anatomy-desc">A product page in four labelled parts. One: what it is and who makes it, with its name, Draft status, maker and review date, and a summary, purpose first. Two: the capabilities table, with columns term, value, detail and sources, the same rows for every product, and values yes (a filled circle), partial (a half-filled circle), no (an empty circle) and unknown (a question mark). Three: the state of play, dated, newest first. Four: the sources, each with the date it was read.</desc>
<style>
  text{font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;}
  .b{font-weight:650} .sb{font-weight:600}
  .nf{fill:none}
  
  .bg{fill:#11161f} .card{fill:#18202c} .muted{fill:#151c27} .accent{fill:#1d2d40}
  .primary{fill:#9cc3e6} .notice{fill:#2b2412}
  .ln{stroke:#6f7c90} .lnp{stroke:#9cc3e6} .lnn{stroke:#a8873a}
  .fln{fill:#6f7c90} .fp{fill:#9cc3e6}
  .t{fill:#e6e9ef} .tm{fill:#a7b0bf} .tp{fill:#9cc3e6} .ta{fill:#cfe2f4} .tpf{fill:#0d1622}
  .tn{fill:#f1dca4} .yes{fill:#7fd19b} .partial{fill:#f0c36a} .no{fill:#f19a9a} .unk{fill:#a7b0bf}
  .syes{stroke:#7fd19b} .spartial{stroke:#f0c36a} .sno{stroke:#f19a9a}
</style>
<rect class="bg" x="0" y="0" width="400" height="1170"/>
<rect x="20" y="20" width="360" height="1129.3" rx="12" class="card ln" stroke-width="1.25"/><circle cx="49" cy="51" r="13" class="primary"/><text x="49" y="57.5" font-size="18" class="tpf b" text-anchor="middle">1</text><text x="72" y="58" font-size="20" class="tp b">What it is, who makes it</text><text x="36" y="88" font-size="18" class="tm"><tspan x="36" dy="0">Purpose first, each fact cited.</tspan></text><text x="36" y="138.3" font-size="22" class="t b">Product name</text><g><rect x="199.42901200000003" y="119.3" width="65.113" height="27" rx="13.5" class="notice lnn" stroke-width="1.25" stroke-dasharray="3 2.5"/><text x="231.98551200000003" y="139.28" font-size="18" class="tn b" text-anchor="middle">Draft</text></g><text x="36" y="170.3" font-size="18" class="tm">Maker · reviewed date</text><rect x="36" y="186.3" width="328" height="6" rx="3" class="fln"/><rect x="36" y="206.3" width="288" height="6" rx="3" class="fln"/><rect x="36" y="226.3" width="208" height="6" rx="3" class="fln"/><line x1="20" x2="380" y1="246.3" y2="246.3" class="ln" stroke-width="1"/><circle cx="49" cy="277.3" r="13" class="primary"/><text x="49" y="283.8" font-size="18" class="tpf b" text-anchor="middle">2</text><text x="72" y="284.3" font-size="20" class="tp b">Capabilities</text><text x="36" y="314.3" font-size="18" class="tm"><tspan x="36" dy="0">The same rows for every product,</tspan><tspan x="36" dy="24.3">each with its sources.</tspan></text><text x="36" y="384.9" font-size="18" class="t b">Term</text><text x="164" y="384.9" font-size="18" class="t b" text-anchor="middle">Value</text><text x="364" y="384.9" font-size="18" class="t b" text-anchor="end">Sources</text><line x1="36" x2="364" y1="394.9" y2="394.9" class="ln" stroke-width="1.25"/><text x="36" y="421.9" font-size="18" class="tp">Model</text><circle cx="164" cy="415.9" r="8" class="yes"/><rect x="212" y="414.9" width="80" height="6" rx="3" class="fln"/><text x="364" y="421.9" font-size="18" class="tm" text-anchor="end">S1</text><line x1="36" x2="364" y1="436.9" y2="436.9" class="ln" stroke-width="1" opacity="0.6"/><text x="36" y="463.9" font-size="18" class="tp">Skill</text><circle cx="164" cy="457.9" r="7" class="nf spartial" stroke-width="2"/><path d="M 164 450.9 A 7 7 0 0 0 164 464.9 Z" class="partial"/><rect x="212" y="456.9" width="80" height="6" rx="3" class="fln"/><text x="364" y="463.9" font-size="18" class="tm" text-anchor="end">S1</text><line x1="36" x2="364" y1="478.9" y2="478.9" class="ln" stroke-width="1" opacity="0.6"/><text x="36" y="505.9" font-size="18" class="tp">Channel</text><circle cx="164" cy="499.9" r="7" class="nf sno" stroke-width="2"/><rect x="212" y="498.9" width="80" height="6" rx="3" class="fln"/><text x="364" y="505.9" font-size="18" class="tm" text-anchor="end">S1</text><line x1="36" x2="364" y1="520.9" y2="520.9" class="ln" stroke-width="1" opacity="0.6"/><text x="36" y="547.9" font-size="18" class="tp">A2A</text><text x="164" y="548.4" font-size="19" class="unk b" text-anchor="middle">?</text><rect x="212" y="540.9" width="80" height="6" rx="3" class="fln"/><text x="364" y="547.9" font-size="18" class="tm" text-anchor="end">S1</text><line x1="36" x2="364" y1="562.9" y2="562.9" class="ln" stroke-width="1" opacity="0.6"/><text x="212" y="384.9" font-size="18" class="t b">Detail</text><circle cx="45" cy="588.9" r="8" class="yes"/><text x="66" y="594.9" font-size="18" class="t"><tspan x="66" dy="0">Yes</tspan></text><circle cx="45" cy="621.1999999999999" r="7" class="nf spartial" stroke-width="2"/><path d="M 45 614.1999999999999 A 7 7 0 0 0 45 628.1999999999999 Z" class="partial"/><text x="66" y="627.1999999999999" font-size="18" class="t"><tspan x="66" dy="0">Partial: in preview, in part, or</tspan><tspan x="66" dy="24.3">through an adapter</tspan></text><circle cx="45" cy="677.8" r="7" class="nf sno" stroke-width="2"/><text x="66" y="683.8" font-size="18" class="t"><tspan x="66" dy="0">No</tspan></text><text x="45" y="716.5999999999999" font-size="19" class="unk b" text-anchor="middle">?</text><text x="66" y="716.0999999999999" font-size="18" class="t"><tspan x="66" dy="0">Unknown: no source read says</tspan></text><line x1="20" x2="380" y1="742.3999999999999" y2="742.3999999999999" class="ln" stroke-width="1"/><circle cx="49" cy="773.3999999999999" r="13" class="primary"/><text x="49" y="779.8999999999999" font-size="18" class="tpf b" text-anchor="middle">3</text><text x="72" y="780.3999999999999" font-size="20" class="tp b">State of play</text><text x="36" y="810.3999999999999" font-size="18" class="tm"><tspan x="36" dy="0">Dated, newest first; added, never</tspan><tspan x="36" dy="24.3">rewritten.</tspan></text><text x="36" y="880.9999999999999" font-size="18" class="t sb">Latest date</text><rect x="36" y="892.9999999999999" width="298" height="6" rx="3" class="fln"/><text x="36" y="934.9999999999999" font-size="18" class="t sb">Earlier date</text><rect x="36" y="946.9999999999999" width="298" height="6" rx="3" class="fln"/><line x1="20" x2="380" y1="982.9999999999999" y2="982.9999999999999" class="ln" stroke-width="1"/><circle cx="49" cy="1013.9999999999999" r="13" class="primary"/><text x="49" y="1020.4999999999999" font-size="18" class="tpf b" text-anchor="middle">4</text><text x="72" y="1020.9999999999999" font-size="20" class="tp b">Sources</text><text x="36" y="1051" font-size="18" class="tm"><tspan x="36" dy="0">Each with the date it was read.</tspan></text><text x="36" y="1097.3" font-size="18" class="t b">S1</text><text x="76" y="1097.3" font-size="18" class="tp">Publisher, title</text><text x="364" y="1097.3" font-size="18" class="tm" text-anchor="end">read date</text><text x="36" y="1129.3" font-size="18" class="t b">S2</text><text x="76" y="1129.3" font-size="18" class="tp">Publisher, title</text><text x="364" y="1129.3" font-size="18" class="tm" text-anchor="end">read date</text>
</svg>
