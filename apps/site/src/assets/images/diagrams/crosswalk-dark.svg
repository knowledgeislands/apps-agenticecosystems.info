<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1036" width="400" height="1036" role="img" aria-labelledby="crosswalk-title crosswalk-desc">
<title id="crosswalk-title">One term, four vendors' words</title>
<desc id="crosswalk-desc">The industry's term session, one run of an agent, beside each vendor's words for it. Anthropic: Session (exact), Conversation (close); OpenAI: Chat (close), Task (close), Thread (related); Google: Session (exact), Conversation (close); Microsoft: Agent session (exact), Chat (related). The key: exact means exactly the term, close nearly, narrower a name for one kind of it, related only related and easily mistaken for it.</desc>
<style>
  text{font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;}
  .b{font-weight:650} .sb{font-weight:600}
  .nf{fill:none}
  
  .bg{fill:#11161f} .card{fill:#18202c} .muted{fill:#151c27} .accent{fill:#1d2d40}
  .primary{fill:#9cc3e6} .notice{fill:#2b2412}
  .ln{stroke:#6f7c90} .lnp{stroke:#9cc3e6} .lnn{stroke:#a8873a}
  .fln{fill:#6f7c90} .fp{fill:#9cc3e6}
  .t{fill:#e6e9ef} .tm{fill:#a7b0bf} .tp{fill:#9cc3e6} .ta{fill:#cfe2f4} .tpf{fill:#0d1622}
  .tn{fill:#f1dca4} .yes{fill:#7fd19b} .partial{fill:#f0c36a} .no{fill:#f19a9a} .unk{fill:#a7b0bf}
  .syes{stroke:#7fd19b} .spartial{stroke:#f0c36a} .sno{stroke:#f19a9a}
</style>
<rect class="bg" x="0" y="0" width="400" height="1036"/>
<line x1="40" x2="40" y1="164.6" y2="640.6" class="lnp" stroke-width="2"/><rect x="20" y="20" width="360" height="144.6" rx="12" class="muted lnp" stroke-width="2"/><text x="36" y="46" font-size="18" class="tm sb" letter-spacing="0.04em">THE INDUSTRY'S TERM</text><text x="36" y="80" font-size="26" class="tp b">Session</text><text x="36" y="110" font-size="18" class="t"><tspan x="36" dy="0">One run of an agent: its context, its</tspan><tspan x="36" dy="24.3">record and its place.</tspan></text><line x1="40" x2="60" y1="200.6" y2="200.6" class="lnp" stroke-width="2"/><text x="70" y="206.6" font-size="20" class="t b">Anthropic</text><rect x="70" y="218.6" width="96.09788400000001" height="36" rx="7" class="primary"/><text x="82" y="243.1" font-size="18" class="tpf b">Session</text><text x="178.09788400000002" y="243.1" font-size="18" class="tm">exact</text><rect x="71" y="263.6" width="134.54680000000002" height="34" rx="7" class="card lnp" stroke-width="2"/><text x="82" y="287.1" font-size="18" class="t">Conversation</text><text x="218.54680000000002" y="287.1" font-size="18" class="tm">close</text><line x1="40" x2="60" y1="332.6" y2="332.6" class="lnp" stroke-width="2"/><text x="70" y="338.6" font-size="20" class="t b">OpenAI</text><rect x="71" y="351.6" width="59.638" height="34" rx="7" class="card lnp" stroke-width="2"/><text x="82" y="375.1" font-size="18" class="t">Chat</text><text x="143.638" y="375.1" font-size="18" class="tm">close</text><rect x="71" y="395.6" width="64.0444" height="34" rx="7" class="card lnp" stroke-width="2"/><text x="82" y="419.1" font-size="18" class="t">Task</text><text x="148.0444" y="419.1" font-size="18" class="tm">close</text><rect x="71" y="439.6" width="83.8732" height="34" rx="7" class="card ln" stroke-width="2" stroke-dasharray="5 4"/><text x="82" y="463.1" font-size="18" class="t">Thread</text><text x="167.8732" y="463.1" font-size="18" class="tm">related</text><line x1="40" x2="60" y1="508.6" y2="508.6" class="lnp" stroke-width="2"/><text x="70" y="514.6" font-size="20" class="t b">Google</text><rect x="70" y="526.6" width="96.09788400000001" height="36" rx="7" class="primary"/><text x="82" y="551.1" font-size="18" class="tpf b">Session</text><text x="178.09788400000002" y="551.1" font-size="18" class="tm">exact</text><rect x="71" y="571.6" width="134.54680000000002" height="34" rx="7" class="card lnp" stroke-width="2"/><text x="82" y="595.1" font-size="18" class="t">Conversation</text><text x="218.54680000000002" y="595.1" font-size="18" class="tm">close</text><line x1="40" x2="60" y1="640.6" y2="640.6" class="lnp" stroke-width="2"/><text x="70" y="646.6" font-size="20" class="t b">Microsoft</text><rect x="70" y="658.6" width="149.925732" height="36" rx="7" class="primary"/><text x="82" y="683.1" font-size="18" class="tpf b">Agent session</text><text x="231.925732" y="683.1" font-size="18" class="tm">exact</text><rect x="71" y="703.6" width="59.638" height="34" rx="7" class="card ln" stroke-width="2" stroke-dasharray="5 4"/><text x="82" y="727.1" font-size="18" class="t">Chat</text><text x="143.638" y="727.1" font-size="18" class="tm">related</text><line x1="20" x2="380" y1="762.6" y2="762.6" class="ln" stroke-width="1.25"/><text x="20" y="796.6" font-size="20" class="t b">How each word matches</text><rect x="20" y="810.6" width="72.327192" height="36" rx="7" class="primary"/><text x="32" y="835.1" font-size="18" class="tpf b">exact</text><text x="140" y="835.1" font-size="18" class="t"><tspan x="140" dy="0">means exactly the term</tspan></text><rect x="21" y="855.6" width="67.16560000000001" height="34" rx="7" class="card lnp" stroke-width="2"/><text x="32" y="879.1" font-size="18" class="t">close</text><text x="140" y="879.1" font-size="18" class="t"><tspan x="140" dy="0">means nearly the term</tspan></text><rect x="20" y="898.6" width="108.45600000000002" height="36" rx="18" class="accent"/><text x="32" y="923.1" font-size="18" class="ta sb">narrower</text><text x="140" y="923.1" font-size="18" class="t"><tspan x="140" dy="0">a name for one kind of it,</tspan><tspan x="140" dy="24.3">such as a product</tspan></text><rect x="21" y="962.2" width="82.58800000000001" height="34" rx="7" class="card ln" stroke-width="2" stroke-dasharray="5 4"/><text x="32" y="985.7" font-size="18" class="t">related</text><text x="140" y="985.7" font-size="18" class="t"><tspan x="140" dy="0">only related, and easily</tspan><tspan x="140" dy="24.3">mistaken for it</tspan></text>
</svg>
