<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1436" width="400" height="1436" role="img" aria-labelledby="protocols-title protocols-desc">
<title id="protocols-title">Which specification joins which parts</title>
<desc id="protocols-desc">Five open specifications as connections. AHP between a client and an agent host, so several clients share one host's sessions. ACP between a client, such as a code editor, and an agent. Agent Skills: a skill folder with a SKILL.md, which an agent harness loads by progressive disclosure. MCP between an agent harness and the servers offering its tools. A2A between an agent and a remote agent in another system.</desc>
<style>
  text{font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;}
  .b{font-weight:650} .sb{font-weight:600}
  .nf{fill:none}
  
  .bg{fill:#11161f} .card{fill:#18202c} .muted{fill:#151c27} .accent{fill:#1d2d40}
  .primary{fill:#9cc3e6} .notice{fill:#2b2412}
  .ln{stroke:#6f7c90} .lnp{stroke:#9cc3e6} .lnn{stroke:#a8873a}
  .fln{fill:#6f7c90} .fp{fill:#9cc3e6}
  .t{fill:#e6e9ef} .tm{fill:#a7b0bf} .tp{fill:#9cc3e6} .ta{fill:#cfe2f4} .tpf{fill:#0d1622}
  .tn{fill:#f1dca4} .yes{fill:#7fd19b} .partial{fill:#f0c36a} .no{fill:#f19a9a} .unk{fill:#a7b0bf}
  .syes{stroke:#7fd19b} .spartial{stroke:#f0c36a} .sno{stroke:#f19a9a}
</style>
<rect class="bg" x="0" y="0" width="400" height="1436"/>
<rect x="20" y="20" width="360" height="46" rx="10" class="accent ln" stroke-width="1.25"/><text x="200" y="50" font-size="20" class="ta b" text-anchor="middle">Client</text><rect x="20" y="154" width="360" height="46" rx="10" class="accent ln" stroke-width="1.25"/><text x="200" y="184" font-size="20" class="ta b" text-anchor="middle">Agent host</text><line x1="200" y1="70" x2="200" y2="150" class="lnp" stroke-width="2"/><path d="M 195.6503446588877 140.99552897647322 L 200 150 L 204.3496553411123 140.99552897647322" class="nf lnp" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 204.3496553411123 79.00447102352678 L 200 70 L 195.6503446588877 79.00447102352678" class="nf lnp" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="165.783184" y="94" width="68.433632" height="32" rx="16" class="primary"/><text x="200" y="116" font-size="18" class="tpf b" text-anchor="middle">AHP</text><text x="20" y="232" font-size="18" class="t"><tspan x="20" dy="0">Several clients share one host's sessions,</tspan><tspan x="20" dy="24.3">each seeing the same live state.</tspan></text><line x1="20" x2="380" y1="278.6" y2="278.6" class="ln" stroke-width="1" opacity="0.7"/><rect x="20" y="300.6" width="360" height="46" rx="10" class="accent ln" stroke-width="1.25"/><text x="200" y="330.6" font-size="20" class="ta b" text-anchor="middle">Client</text><rect x="20" y="434.6" width="360" height="46" rx="10" class="accent ln" stroke-width="1.25"/><text x="200" y="464.6" font-size="20" class="ta b" text-anchor="middle">Agent</text><line x1="200" y1="350.6" x2="200" y2="430.6" class="lnp" stroke-width="2"/><path d="M 195.6503446588877 421.59552897647325 L 200 430.6 L 204.3496553411123 421.59552897647325" class="nf lnp" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 204.3496553411123 359.6044710235268 L 200 350.6 L 195.6503446588877 359.6044710235268" class="nf lnp" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="167.256574" y="374.6" width="65.48685200000001" height="32" rx="16" class="primary"/><text x="200" y="396.6" font-size="18" class="tpf b" text-anchor="middle">ACP</text><text x="20" y="512.6" font-size="18" class="t"><tspan x="20" dy="0">Any code editor drives any coding agent,</tspan><tspan x="20" dy="24.3">which it launches.</tspan></text><line x1="20" x2="380" y1="559.2" y2="559.2" class="ln" stroke-width="1" opacity="0.7"/><rect x="20" y="581.2" width="360" height="46" rx="10" class="accent ln" stroke-width="1.25"/><text x="200" y="611.2" font-size="20" class="ta b" text-anchor="middle">Skill</text><rect x="20" y="715.2" width="360" height="46" rx="10" class="accent ln" stroke-width="1.25"/><text x="200" y="745.2" font-size="20" class="ta b" text-anchor="middle">Agent harness</text><line x1="200" y1="631.2" x2="200" y2="711.2" class="lnp" stroke-width="2"/><path d="M 195.6503446588877 702.1955289764733 L 200 711.2 L 204.3496553411123 702.1955289764733" class="nf lnp" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="132.779248" y="655.2" width="134.441504" height="32" rx="16" class="primary"/><text x="200" y="677.2" font-size="18" class="tpf b" text-anchor="middle">Agent Skills</text><text x="277.220752" y="677.2" font-size="18" class="tm">loaded by</text><text x="20" y="793.2" font-size="18" class="t"><tspan x="20" dy="0">A folder with a SKILL.md, which any</tspan><tspan x="20" dy="24.3">harness loads a little at a time:</tspan><tspan x="20" dy="24.3">progressive disclosure.</tspan></text><line x1="20" x2="380" y1="864.1" y2="864.1" class="ln" stroke-width="1" opacity="0.7"/><rect x="20" y="886.1" width="360" height="46" rx="10" class="accent ln" stroke-width="1.25"/><text x="200" y="916.1" font-size="20" class="ta b" text-anchor="middle">Agent harness</text><rect x="20" y="1020.1" width="360" height="46" rx="10" class="accent ln" stroke-width="1.25"/><text x="200" y="1050.1" font-size="20" class="ta b" text-anchor="middle">MCP server</text><line x1="200" y1="936.1" x2="200" y2="1016.1" class="lnp" stroke-width="2"/><path d="M 195.6503446588877 1007.0955289764732 L 200 1016.1 L 204.3496553411123 1007.0955289764732" class="nf lnp" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 204.3496553411123 945.1044710235268 L 200 936.1 L 195.6503446588877 945.1044710235268" class="nf lnp" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="165.783184" y="960.1" width="68.433632" height="32" rx="16" class="primary"/><text x="200" y="982.1" font-size="18" class="tpf b" text-anchor="middle">MCP</text><text x="20" y="1098.1" font-size="18" class="t"><tspan x="20" dy="0">The servers offering an agent its tools</tspan><tspan x="20" dy="24.3">and data.</tspan></text><line x1="20" x2="380" y1="1144.6999999999998" y2="1144.6999999999998" class="ln" stroke-width="1" opacity="0.7"/><rect x="20" y="1166.6999999999998" width="360" height="46" rx="10" class="accent ln" stroke-width="1.25"/><text x="200" y="1196.6999999999998" font-size="20" class="ta b" text-anchor="middle">Agent</text><rect x="20" y="1300.6999999999998" width="360" height="46" rx="10" class="card ln" stroke-width="1.25" stroke-dasharray="5 4"/><text x="200" y="1330.6999999999998" font-size="20" class="t b" text-anchor="middle">Remote agent</text><line x1="200" y1="1216.6999999999998" x2="200" y2="1296.6999999999998" class="lnp" stroke-width="2"/><path d="M 195.6503446588877 1287.695528976473 L 200 1296.6999999999998 L 204.3496553411123 1287.695528976473" class="nf lnp" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 204.3496553411123 1225.7044710235266 L 200 1216.6999999999998 L 195.6503446588877 1225.7044710235266" class="nf lnp" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="168.33706" y="1240.6999999999998" width="63.32588" height="32" rx="16" class="primary"/><text x="200" y="1262.6999999999998" font-size="18" class="tpf b" text-anchor="middle">A2A</text><text x="20" y="1378.6999999999998" font-size="18" class="t"><tspan x="20" dy="0">An agent in another system, reached</tspan><tspan x="20" dy="24.3">without seeing its memory or tools.</tspan></text>
</svg>
