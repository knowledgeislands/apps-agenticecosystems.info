<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 717" width="400" height="717" role="img" aria-labelledby="names-senses-title names-senses-desc">
<title id="names-senses-title">One name, several senses</title>
<desc id="names-senses-desc">Product names that the crosswalk lists under more than one term: Claude (Anthropic): model, agent, agent host; Codex (OpenAI): model, agent harness, agent; Gemini (Google): model, agent; Claude Code (Anthropic): agent harness, agent; Copilot (Microsoft): agent harness, agent; ChatGPT (OpenAI): agent, agent host.</desc>
<style>
  text{font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;}
  .b{font-weight:650} .sb{font-weight:600}
  .nf{fill:none}
  
  .bg{fill:#f8f7f4} .card{fill:#ffffff} .muted{fill:#eeece6} .accent{fill:#e7eff7}
  .primary{fill:#1f4e79} .notice{fill:#fdf3dc}
  .ln{stroke:#7c8492} .lnp{stroke:#1f4e79} .lnn{stroke:#a07a1c}
  .fln{fill:#7c8492} .fp{fill:#1f4e79}
  .t{fill:#1b2230} .tm{fill:#4f5868} .tp{fill:#1f4e79} .ta{fill:#173b5c} .tpf{fill:#ffffff}
  .tn{fill:#5a4207} .yes{fill:#1d6b3a} .partial{fill:#8a5a00} .no{fill:#9b2c2c} .unk{fill:#4f5868}
  .syes{stroke:#1d6b3a} .spartial{stroke:#8a5a00}
</style>
<rect class="bg" x="0" y="0" width="400" height="717"/>
<text x="20" y="40" font-size="18" class="t"><tspan x="20" dy="0">A maker's name can mean its model, its</tspan><tspan x="20" dy="24.3">agent, its harness or its agent host. Read</tspan><tspan x="20" dy="24.3">which from the context.</tspan></text><rect x="20" y="110.9" width="81.4668" height="36" rx="18" class="accent"/><text x="32" y="135.4" font-size="18" class="ta sb">Claude</text><text x="113.4668" y="135.4" font-size="18" class="tm">Anthropic</text><path d="M 36 148.9 V 174.9 H 48" class="nf ln" stroke-width="1.75"/><rect x="55" y="157.9" width="72.3064" height="34" rx="7" class="card ln" stroke-width="1.5"/><text x="66" y="180.9" font-size="18" class="t">Model</text><rect x="137.3064" y="157.9" width="69.5524" height="34" rx="7" class="card ln" stroke-width="1.5"/><text x="148.3064" y="180.9" font-size="18" class="t">Agent</text><rect x="216.8588" y="157.9" width="109.9444" height="34" rx="7" class="card ln" stroke-width="1.5"/><text x="227.8588" y="180.9" font-size="18" class="t">Agent host</text><rect x="20" y="210.9" width="75.9588" height="36" rx="18" class="accent"/><text x="32" y="235.4" font-size="18" class="ta sb">Codex</text><text x="107.9588" y="235.4" font-size="18" class="tm">OpenAI</text><path d="M 36 248.89999999999998 V 274.9 H 48" class="nf ln" stroke-width="1.75"/><rect x="55" y="257.9" width="72.3064" height="34" rx="7" class="card ln" stroke-width="1.5"/><text x="66" y="280.9" font-size="18" class="t">Model</text><rect x="137.3064" y="257.9" width="144.094" height="34" rx="7" class="card ln" stroke-width="1.5"/><text x="148.3064" y="280.9" font-size="18" class="t">Agent harness</text><rect x="291.4004" y="257.9" width="69.5524" height="34" rx="7" class="card ln" stroke-width="1.5"/><text x="302.4004" y="280.9" font-size="18" class="t">Agent</text><rect x="20" y="310.9" width="84.95519999999999" height="36" rx="18" class="accent"/><text x="32" y="335.4" font-size="18" class="ta sb">Gemini</text><text x="116.95519999999999" y="335.4" font-siz