<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1018" width="400" height="1018" role="img" aria-labelledby="layers-stack-title layers-stack-desc">
<title id="layers-stack-title">The parts, from the model up</title>
<desc id="layers-stack-desc">Eight terms stacked in reading order from the base: model, agent harness, agent, session, execution environment, machine, agent host and client. The agent host runs agent harnesses and owns their sessions; it is neither the machine nor the execution environment, though it may provide one. The client is a window onto a session.</desc>
<style>
  text{font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;}
  .b{font-weight:650} .sb{font-weight:600}
  .nf{fill:none}
  
  .bg{fill:#11161f} .card{fill:#18202c} .muted{fill:#151c27} .accent{fill:#1d2d40}
  .primary{fill:#9cc3e6} .notice{fill:#2b2412}
  .ln{stroke:#6f7c90} .lnp{stroke:#9cc3e6} .lnn{stroke:#a8873a}
  .fln{fill:#6f7c90} .fp{fill:#9cc3e6}
  .t{fill:#e6e9ef} .tm{fill:#a7b0bf} .tp{fill:#9cc3e6} .ta{fill:#cfe2f4} .tpf{fill:#0d1622}
  .tn{fill:#f1dca4} .yes{fill:#7fd19b} .partial{fill:#f0c36a} .no{fill:#f19a9a} .unk{fill:#a7b0bf}
  .syes{stroke:#7fd19b} .spartial{stroke:#f0c36a}
</style>
<rect class="bg" x="0" y="0" width="400" height="1018"/>
<rect x="50" y="20" width="330" height="93" rx="10" class="card ln" stroke-width="1.25"/><circle cx="77" cy="47" r="13" class="primary"/><text x="77" y="53.5" font-size="18" class="tpf b" text-anchor="middle">8</text><text x="98" y="54" font-size="21" class="tp b">Client</text><text x="98" y="81" font-size="18" class="t"><tspan x="98" dy="0">A window onto a session.</tspan></text><rect x="50" y="123" width="330" height="200.2" rx="10" class="card lnp" stroke-width="2.5"/><rect x="94" y="230.29999999999998" width="272" height="84.9" rx="6" class="notice"/><circle cx="77" cy="150" r="13" class="primary"/><text x="77" y="156.5" font-size="18" class="tpf b" text-anchor="middle">7</text><text x="98" y="157" font-size="21" class="tp b">Agent host</text><text x="98" y="184" font-size="18" class="t"><tspan x="98" dy="0">Runs agent harnesses and</tspan><tspan x="98" dy="24.3">owns their sessions.</tspan></text><text x="98" y="254.3" font-size="18" class="tn"><tspan x="98" dy="0">Not the machine, and not the</tspan><tspan x="98" dy="24.3">execution environment, though</tspan><tspan x="98" dy="24.3">it may provide one.</tspan></text><rect x="50" y="333.2" width="330" height="117.3" rx="10" class="card ln" stroke-width="1.25"/><circle cx="77" cy="360.2" r="13" class="primary"/><text x="77" y="366.7" font-size="18" class="tpf b" text-anchor="middle">6</text><text x="98" y="367.2" font-size="21" class="tp b">Machine</text><text x="98" y="394.2" font-size="18" class="t"><tspan x="98" dy="0">A computer, physical or</tspan><tspan x="98" dy="24.3">virtual.</tspan></text><rect x="50" y="460.5" width="330" height="93" rx="10" class="card ln" stroke-width="1.25"/><circle cx="77" cy="487.5" r="13" class="primary"/><text x="77" y="494" font-size="18" class="tpf b" text-anchor="middle">5</text><text x="98" y="494.5" font-size="21" class="tp b">Execution environment</text><text x="98" y="521.5" font-size="18" class="t"><tspan x="98" dy="0">Where tool calls run.</tspan></text><rect x="50" y="563.5" width="330" height="93" rx="10" class="card ln" stroke-width="1.25"/><circle cx="77" cy="590.5" r="13" class="primary"/><text x="77" y="597" font-size="18" class="tpf b" text-anchor="middle">4</text><text x="98" y="597.5" font-size="21" class="tp b">Session</text><text x="98" y="624.5" font-size="18" class="t"><tspan x="98" dy="0">One run of an agent.</tspan></text><rect x="50" y="666.5" width="330" height="117.3" rx="10" class="card ln" stroke-width="1.25"/><circle cx="77" cy="693.5" r="13" class="primary"/><text x="77" y="700" font-size="18" class="tpf b" text-anchor="middle">3</text><text x="98" y="700.5" font-size="21" class="tp b">Agent</text><text x="98" y="727.5" font-size="18" class="t"><tspan x="98" dy="0">A model working through a</tspan><tspan x="98" dy="24.3">harness.</tspan></text><rect x="50" y="793.8" width="330" height="93" rx="10" class="card ln" stroke-width="1.25"/><circle cx="77" cy="820.8" r="13" class="primary"/><text x="77" y="827.3" font-size="18" class="tpf b" text-anchor="middle">2</text><text x="98" y="827.8" font-size="21" class="tp b">Agent harness</text><text x="98" y="854.8" font-size="18" class="t"><tspan x="98" dy="0">Turns the model into an agent.</tspan></text><rect x="50" y="896.8" width="330" height="93" rx="10" class="accent ln" stroke-width="1.25"/><circle cx="77" cy="923.8" r="13" class="primary"/><text x="77" y="930.3" font-size="18" class="tpf b" text-anchor="middle">1</text><text x="98" y="930.8" font-size="21" class="tp b">Model</text><text x="98" y="957.8" font-size="18" class="t"><tspan x="98" dy="0">Decides; acts on nothing alone.</tspan></text><line x1="32" y1="983.8" x2="32" y2="28" class="lnp" stroke-width="2.5"/><path d="M 36.3496553411123 37.00447102352677 L 32 28 L 27.650344658887697 37.00447102352677" class="nf lnp" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text transform="translate(26 949.8) rotate(-90)" font-size="18" class="tp sb">Read from the model up</text>
</svg>
